# Nova Exo v0.1 - Limine Boot Configuration
# Configurazione per boot su hardware reale (EliteDesk/IdeaPad)

timeout: 0
verbose: yes
serial: yes

# Entry di boot principale
/Nova Exo
    protocol: limine
    path: boot():/boot/nova-exo

# Entry di boot con Modello Nucleo precaricato in RAM da Limine
/Nova Exo (con Nucleo)
    protocol: limine
    path: boot():/boot/nova-exo
    module_path: boot():/boot/nucleo_41m.bin
